<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>微信读书年度热力图</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;min-width:0;margin:0;overflow-x:hidden;background:#fff;color:#24292f;font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:100%;min-width:0;margin:0;border:1px solid #e5e7eb;border-radius:10px;padding:8px 9px 6px;background:#fff;overflow:hidden}
    .title{display:flex;align-items:center;gap:3px;margin:0 0 2px;font-size:17px;line-height:24px;font-weight:700;white-space:nowrap}
    .year-picker{position:relative;display:inline-flex;align-items:center;border-radius:5px;background:transparent}
    select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;color:#68727d;font:600 10px/1.2 "PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:3px 25px 3px 7px;cursor:pointer}
    .calendar-icon{position:absolute;right:6px;font-size:12px;line-height:1;pointer-events:none}
    select:focus-visible{outline:2px solid #c8d2df;outline-offset:1px;border-radius:5px}
    img{display:block;width:100%;max-width:100%;height:auto;object-fit:contain}
    @media(max-width:640px){.card{padding:7px 6px 5px;border-radius:8px}.title{font-size:16px}select{font-size:9px;padding:3px 23px 3px 6px}.calendar-icon{right:6px;font-size:11px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="title">微信读书 · <label class="year-picker"><select id="year" aria-label="选择年份"></select><span class="calendar-icon" aria-hidden="true">📅</span></label></div>
    <img id="heatmap" src="../weread-2026.svg" alt="2026 年微信读书热力图">
  </main>
  <script>
    const select=document.querySelector('#year');
    const heatmap=document.querySelector('#heatmap');
    const years=[];
    for(let year=2026;year>=2020;year--){const value=String(year);years.push(value);select.add(new Option(value,value))}
    const requested=new URLSearchParams(location.search).get('year');
    select.value=years.includes(requested)?requested:years[0];
    function show(){const y=select.value;heatmap.src=`../weread-${y}.svg?v=${Date.now()}`;heatmap.alt=`${y} 年微信读书热力图`;history.replaceState(null,'',`?year=${y}`)}
    select.addEventListener('change',show);show();
  </script>
</body>
</html>
