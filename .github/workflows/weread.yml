name: WeRead Pro sync

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: Sync every book and every note
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync books and notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      NOTION_SYSTEM_PAGE: ${{ vars.NOTION_SYSTEM_PAGE }}
      BOOK_DATABASE_NAME: ${{ vars.BOOK_DATABASE_NAME }}
      CHAPTER_DATABASE_NAME: ${{ vars.CHAPTER_DATABASE_NAME }}
      READ_DATABASE_NAME: ${{ vars.READ_DATABASE_NAME }}
      FULL_SYNC: ${{ inputs.full_sync && 'true' || 'false' }}
      FULL_SYNC_NOTES: ${{ inputs.full_sync && 'true' || 'false' }}
      ALLOW_REMOTE_DELETIONS: ${{ vars.ALLOW_REMOTE_DELETIONS || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify status and heatmap logic
        run: python -m unittest tests.test_book tests.test_heatmap_svg tests.test_weread_api
      - name: Sync bookshelf and progress
        run: python -u scripts/book.py
      - name: Sync notes and highlights
        run: python -u scripts/weread.py
