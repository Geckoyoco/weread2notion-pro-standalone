name: WeRead Pro statistics

on:
  workflow_dispatch:
    inputs:
      year:
        description: Heatmap year (defaults to the current year)
        required: false
        type: string
  schedule:
    - cron: "43 */6 * * *"

concurrency:
  group: heatmap-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  statistics:
    name: Sync reading statistics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      NOTION_SYSTEM_PAGE: ${{ vars.NOTION_SYSTEM_PAGE }}
      HEATMAP_BLOCK_ID: ${{ secrets.HEATMAP_BLOCK_ID }}
      BOOK_DATABASE_NAME: ${{ vars.BOOK_DATABASE_NAME }}
      CHAPTER_DATABASE_NAME: ${{ vars.CHAPTER_DATABASE_NAME }}
      READ_DATABASE_NAME: ${{ vars.READ_DATABASE_NAME }}
      REF: ${{ github.ref }}
      REPOSITORY: ${{ github.repository }}
      YEAR: ${{ inputs.year || vars.YEAR }}
      HEATMAP_BACKGROUND: ${{ vars.HEATMAP_BACKGROUND || '#FFFFFF' }}
      HEATMAP_EMPTY: ${{ vars.HEATMAP_EMPTY || '#EBEDF0' }}
      HEATMAP_LOW: ${{ vars.HEATMAP_LOW || '#ACE7AE' }}
      HEATMAP_MEDIUM: ${{ vars.HEATMAP_MEDIUM || '#69C16E' }}
      HEATMAP_HIGH: ${{ vars.HEATMAP_HIGH || '#216E39' }}
      HEATMAP_TEXT: ${{ vars.HEATMAP_TEXT || '#24292F' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sync statistics and render heatmap
        run: python -u scripts/read_time.py --skip-heatmap-update
      - name: Publish heatmap asset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add OUT_FOLDER
          git diff --cached --quiet || git commit -m "chore: update reading heatmap"
          git push
      - name: Update Notion heatmap link
        run: python -u scripts/read_time.py --heatmap-only
