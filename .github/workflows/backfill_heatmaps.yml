name: Backfill historical heatmaps

on:
  workflow_dispatch:
    inputs:
      years:
        description: Space-separated years to refresh
        required: false
        default: "2020 2021 2022 2023 2024 2025 2026"
        type: string
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: heatmap-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    name: Read genuine data for 2020-2026
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      HEATMAP_BACKGROUND: ${{ vars.HEATMAP_BACKGROUND || '#FFFFFF' }}
      HEATMAP_EMPTY: ${{ vars.HEATMAP_EMPTY || '#EBEDF0' }}
      HEATMAP_LOW: ${{ vars.HEATMAP_LOW || '#ACE7AE' }}
      HEATMAP_MEDIUM: ${{ vars.HEATMAP_MEDIUM || '#69C16E' }}
      HEATMAP_HIGH: ${{ vars.HEATMAP_HIGH || '#216E39' }}
      HEATMAP_TEXT: ${{ vars.HEATMAP_TEXT || '#24292F' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Read and render each year
        env:
          YEARS: ${{ inputs.years || '2020 2021 2022 2023 2024 2025 2026' }}
        run: |
          for year in $YEARS; do
            if ! YEAR="$year" HEATMAP_OUTPUT="OUT_FOLDER/weread-$year.svg" \
              python -u scripts/read_time.py --render-only; then
              echo "读取 $year 失败，保留现有文件，等待下次重试。"
            fi
          done
      - name: Publish verified yearly assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add OUT_FOLDER/weread-*.svg
          git diff --cached --quiet || git commit -m "chore: refresh historical reading heatmaps"
          git push
